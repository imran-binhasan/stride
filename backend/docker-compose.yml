# Local development / staging stack for the Stride backend.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: stride
      POSTGRES_DB: stride
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Connection pooler (transaction mode) so many workers share few Postgres connections.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: db
      DB_USER: stride
      DB_PASSWORD: stride
      DB_NAME: stride
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "6432:6432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot migration runner — completes before the API starts (safe for multi-replica).
  migrate:
    build: .
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      # Migrations connect directly to Postgres (not through the transaction pooler).
      DATABASE_URL: postgresql+asyncpg://stride:stride@db:5432/stride
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      # Route the app through PgBouncer; disable asyncpg prepared-statement cache for it.
      DATABASE_URL: postgresql+asyncpg://stride:stride@pgbouncer:6432/stride
      DB_DISABLE_PREPARED_CACHE: "true"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      REDIS_URL: redis://redis:6379/0
      REDIS_USE_FAKE_IF_UNAVAILABLE: "false"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: stride-storage
      JWT_SECRET_KEY: change-me-in-production-min-32-characters-long
      BACKEND_CORS_ORIGINS: "http://localhost:5173"
    ports:
      - "8000:8000"

volumes:
  pgdata:
  miniodata:
