name: Core workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stride_test
          POSTGRES_PASSWORD: stride_test
          POSTGRES_DB: stride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stride_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest --cov=src --cov-report=term
        env:
          STRIDE_TEST_POSTGRES_URL: postgresql+asyncpg://stride_test:stride_test@127.0.0.1:5432/stride_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm test

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxcb1-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libgbm-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: stride-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/stride-desktop-daemon
            desktop/src-tauri/target/release/stride-desktop-daemon.exe
          if-no-files-found: error
  ai-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: docker build -t stride-ai-sandbox:local -f Dockerfile.sandbox .
      - run: STRIDE_TEST_RUNNER=1 pytest -q test_runner.py
