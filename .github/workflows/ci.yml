name: Core workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stride_test
          POSTGRES_PASSWORD: stride_test
          POSTGRES_DB: stride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stride_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest --cov=src --cov-report=term
        env:
          STRIDE_TEST_POSTGRES_URL: postgresql+asyncpg://stride_test:stride_test@127.0.0.1:5432/stride_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
